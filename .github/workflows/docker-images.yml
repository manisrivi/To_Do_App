name: Build and Push Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set lowercased repository image prefix
        run: |
          echo "IMAGE_PREFIX=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514310cfc6ee50f558833d4b522880799e67 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build and push Backend API Docker image
      - name: Build and push Backend API image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./To_Do_App_API
          file: ./To_Do_App_API/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/todo-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/todo-api:latest

      # 2. Build and push Frontend UI Docker image
      - name: Build and push Frontend UI image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./To_Do_App_UI
          file: ./To_Do_App_UI/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/todo-ui:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/todo-ui:latest
